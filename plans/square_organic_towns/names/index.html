<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Name Lab</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d2125; --muted: #5f6870; --line: #dcdad3;
  --accent: #0e7a6d; --chip: #ecebe6; --onaccent: #ffffff; --up: #2f7d32; --down: #b0413e; --warn: #8a5a12; --chg: #fff6dc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181b; --panel: #1e2226; --ink: #e7e9ea; --muted: #9aa3ab; --line: #30363c;
    --accent: #4cc3b1; --chip: #272c31; --onaccent: #15181b; --up: #7fcf83; --down: #ec8f8b; --warn: #e0ab5c; --chg: #2e2a1d;
  }
}
:root[data-theme="dark"] {
  --bg: #15181b; --panel: #1e2226; --ink: #e7e9ea; --muted: #9aa3ab; --line: #30363c;
  --accent: #4cc3b1; --chip: #272c31; --onaccent: #15181b; --up: #7fcf83; --down: #ec8f8b; --warn: #e0ab5c; --chg: #2e2a1d;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
.wrap { max-width: 1560px; margin: 0 auto; padding: 18px 16px 64px; }
.back { display: inline-block; font-size: 13px; color: var(--accent); text-decoration: none; margin-bottom: 4px; }
.back:hover { text-decoration: underline; }
h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 17px; margin: 0; }
h3 { font-size: 14.5px; margin: 0 0 6px; }
h4 { font-size: 13.5px; margin: 14px 0 6px; }
.head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; justify-content: space-between; margin-bottom: 8px; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 13.5px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
code { font-size: 12px; overflow-wrap: anywhere; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.toolbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button, .btn, select, input[type=number], input[type=search], input:not([type]) { background: var(--panel); color: var(--ink); border: 0; padding: 5px 10px; font: inherit; font-size: 13.5px; }
.seg button { cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--onaccent); }
.btn, select, input[type=number], input[type=search], input:not([type]) { border: 1px solid var(--line); border-radius: 8px; }
.btn { cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--onaccent); border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 2px 8px; font-size: 12.5px; }
input[type=number] { width: 84px; }
label.pick { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--muted); }
.spacer { flex: 1; }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 14px; align-items: start; }
.side { position: sticky; top: 64px; max-height: calc(100vh - 76px); overflow: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 10px; }
.chip { background: var(--chip); border: 1px solid transparent; border-radius: 999px; padding: 2px 9px; font-size: 12.5px; cursor: pointer; color: var(--ink); font-family: inherit; }
.chip[aria-current="true"] { border-color: var(--accent); background: var(--panel); font-weight: 600; }
details { border-top: 1px solid var(--line); padding: 4px 0; }
summary { cursor: pointer; font-size: 13px; font-weight: 600; padding: 2px 0; }
.cnt { display: inline-block; min-width: 18px; text-align: center; font-size: 11px; background: var(--accent); color: var(--onaccent); border-radius: 999px; padding: 0 5px; margin-left: 4px; }
.tagrow { display: grid; grid-template-columns: 108px 1fr 34px; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.tagrow.on { color: var(--ink); }
.tagrow label { display: flex; gap: 5px; align-items: center; cursor: pointer; white-space: nowrap; }
.tagrow input[type=range] { width: 100%; accent-color: var(--accent); }
.tagrow input[disabled] { opacity: .35; }
.tv { font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 999px; background: var(--chip); color: var(--ink); white-space: nowrap; border: 0; font-family: inherit; }
button.pill { cursor: pointer; }
.pill.ok { background: var(--accent); color: var(--onaccent); }
.pill.warn { background: var(--warn); color: var(--onaccent); }
.reshead { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 6px; }
.why { height: 232px; overflow: auto; margin-bottom: 12px; font-size: 13px; }
.whyhead { margin-bottom: 4px; }
.big { font-size: 18px; }
.kvt { border-collapse: collapse; width: 100%; }
.kvt th { text-align: left; vertical-align: top; color: var(--muted); font-weight: 600; padding: 2px 10px 2px 0; white-space: nowrap; width: 1%; }
.kvt td { padding: 2px 0; }
.alts { margin: 2px 0 0; padding-left: 22px; columns: 2; font-size: 12.5px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.allmodes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; align-items: start; }
.allmodes .col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; }
.allmodes .col > p { min-height: 5.4em; margin: 0 0 6px; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.stack .ncard { background: var(--bg); }
.ncard { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px 6px; cursor: pointer; min-width: 0; }
.ncard:hover, .ncard:focus-visible { border-color: var(--accent); outline: none; }
.ncard.sel { box-shadow: 0 0 0 2px var(--accent); }
.ncard.up { border-left: 4px solid var(--up); }
.ncard.down { border-left: 4px solid var(--down); }
.ncard.down .nm { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--down); }
.ncard.pinned { background: var(--chip); }
.ncard.fail { color: var(--muted); font-size: 12.5px; cursor: default; }
.nm { font-size: 15.5px; font-weight: 600; overflow-wrap: anywhere; padding-right: 2px; }
.pt { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.acts { display: flex; gap: 2px; margin-top: 3px; opacity: .5; }
.ncard:hover .acts, .ncard.up .acts, .ncard.down .acts, .ncard.pinned .acts { opacity: 1; }
.ic { background: transparent; border: 1px solid transparent; border-radius: 6px; cursor: pointer; font-size: 13px; padding: 0 4px; line-height: 1.5; color: var(--muted); filter: grayscale(1); }
.ic[aria-pressed="true"] { border-color: var(--line); background: var(--panel); filter: none; }
.ic:hover { border-color: var(--line); filter: none; }
#tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 26px 0 0; border-bottom: 1px solid var(--line); }
#tabs button { background: transparent; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; padding: 6px 12px; font: inherit; font-size: 13.5px; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
#tabs button[aria-selected="true"] { background: var(--panel); border-color: var(--line); color: var(--ink); font-weight: 600; }
#tabbody { border-top-left-radius: 0; min-height: 200px; }
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
.tablebox th, .tablebox td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tablebox thead th { color: var(--muted); font-weight: 600; font-size: 12.5px; position: sticky; top: 0; background: var(--panel); }
.maptable td:first-child { min-width: 220px; }
.listbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
.addrow { display: flex; gap: 6px; margin: 6px 0 8px; }
.addrow input { flex: 1; min-width: 0; }
.listtable .num { text-align: right; font-variant-numeric: tabular-nums; width: 1%; white-space: nowrap; }
.listtable input.lineedit { width: 100%; min-width: 260px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; border-color: transparent; background: transparent; }
.listtable input.lineedit:focus { border-color: var(--accent); background: var(--panel); outline: none; }
tr.chg td, tr.chg th { background: var(--chg); }
.cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 12px; }
.cgrid section { min-width: 0; }
.ctable { width: 100%; }
.ctable th { text-align: left; font-weight: 600; font-size: 12.5px; padding: 2px 8px 2px 0; }
.ctable td { padding: 2px 6px 2px 0; font-size: 12.5px; }
.ctable td.muted { font-variant-numeric: tabular-nums; }
.stoptable th { width: 110px; vertical-align: top; }
.stoptable td { line-height: 1.9; }
textarea { width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
ul.plain { list-style: none; padding: 0; margin: 0; } ul.plain li { padding: 3px 0; border-bottom: 1px solid var(--line); }
pre.json { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 12px; max-height: 480px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
/* map mode (NEXT_PHASE_BRIEF 53 Part B) */
.mappanel { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
.mappanel .cgrid { margin: 0; }
.mapsvg { width: 100%; height: auto; display: block; margin-top: 6px; }
.mixtable td, .mixtable th { vertical-align: middle; }
.mixtable input[type=number] { width: 68px; }
.bar { display: inline-block; height: 7px; border-radius: 4px; min-width: 2px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
.abrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0; }
.abpick { text-align: left; padding: 10px; font-size: 15px; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13.5px; z-index: 20; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; max-height: none; }
  .toolbar { position: static; }
  .alts { columns: 1; }
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">&larr; Organic Towns</a>
  <div class="head">
    <div>
      <h1>Name lab</h1>
      <p class="sub">Generated town names for <code>square_organic_towns</code>: build a site, generate, compare ideas, tune the lists, rate, export. <span id="builtinfo"></span></p>
    </div>
    <div class="small"><span id="portbadge"></span> <span id="stateinfo" class="muted"></span></div>
  </div>

  <div class="toolbar">
    <label class="pick">Language <select id="lang" aria-label="Language"></select></label>
    <label class="pick" title="The map's climate (ot_climate): its own words (palms and reefs, mesas, fells) and the words it rules out">Climate <select id="climate" aria-label="Climate"><option value="temperate">Temperate</option><option value="tropical">Tropical</option><option value="dry">Dry</option><option value="subarctic">Subarctic</option></select></label>
    <div class="seg" role="group" aria-label="Generator" id="modes">
      <button data-mode="morph">Morpheme</button>
      <button data-mode="remix">Real-name remix</button>
      <button data-mode="desc">Descriptive</button>
      <button data-mode="feat">Feature + settlement</button>
      <button data-mode="old">Old forms</button>
      <button data-mode="map" title="The mod's whole-map naming with the per-map plan">Whole map (plan)</button>
      <button data-mode="all">All side by side</button>
    </div>
    <label class="pick">Seed <input type="number" id="seed" min="1" aria-label="Seed"></label>
    <button class="btn" id="dice" title="Next seed">🎲</button>
    <label class="pick">Dialect <select id="dialect" aria-label="Dialect"></select></label>
    <label class="pick">Affix <input type="range" id="affixP" min="0" max="1" step="0.05" aria-label="Affix probability"> <span id="affixPv"></span></label>
    <label class="pick"><input type="checkbox" id="character"> Character town</label>
    <label class="pick" title="The map's word budget: a generic word (Lake, Forest, -see ...) at most once per 8 towns of the run"><input type="checkbox" id="budget"> Word budget</label>
    <label class="pick">Towns <select id="shared" aria-label="Towns share one map"><option value="1">on one map</option><option value="0">each on its own map</option></select></label>
    <label class="pick">Count <input type="number" id="count" min="5" max="200" aria-label="Count"></label>
    <button class="btn primary" id="gen">Generate</button>
    <span class="spacer"></span>
    <button class="btn" id="exportBtn" title="Copy and download your settings as JSON">Export</button>
    <button class="btn" id="reset" title="Reset everything">Reset</button>
  </div>

  <div class="layout">
    <aside class="card side" aria-label="Site builder">
      <h2>Site</h2>
      <p class="muted small" style="margin:2px 0 0">Presets, or toggle tags and set their strength (the weights ot_placename.siteTags gives; 0.2 counts).</p>
      <div class="chips" id="presets"></div>
      <div id="tags"></div>
      <p class="small" style="margin:10px 0 4px"><b>Ranked</b> <span class="muted">(weight × specificity)</span></p>
      <div id="ranked" class="small"></div>
      <p style="margin:10px 0 0"><button class="btn small" id="clearSite">Clear all tags</button></p>
    </aside>
    <main>
      <div class="reshead"><h2 id="resTitle"></h2><span id="resDesc" class="muted small"></span></div>
      <div class="card why" id="why" aria-live="polite"></div>
      <div id="results"></div>
    </main>
  </div>

  <nav id="tabs" role="tablist" aria-label="Sections">
    <button data-tab="map" role="tab">This map</button>
    <button data-tab="lists" role="tab">Morpheme lists</button>
    <button data-tab="consts" role="tab">Constants</button>
    <button data-tab="opts" role="tab">Mode options</button>
    <button data-tab="rated" role="tab">Pinned and rated</button>
    <button data-tab="stop" role="tab">Stop names</button>
    <button data-tab="port" role="tab">Port check</button>
    <button data-tab="export" role="tab">Export</button>
  </nav>
  <div class="card" id="tabbody" role="tabpanel"></div>
  <div id="toast" hidden></div>
</div>
<script src="data.js"></script>
<script src="ideas.js"></script>
<script src="gen.js"></script>
<script src="port_check.js"></script>
<script src="lab.js"></script>
</body>
</html>
