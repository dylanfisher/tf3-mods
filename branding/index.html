<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Square Covers</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="gallery.css">
<script src="cover.js"></script>
<script src="mods.js"></script>
<script src="gallery.js"></script>
</head>
<body>
<main>
  <h1>Square: mod covers</h1>
  <p>House style for every mod (direction B2, Diagonal Split). Edit <code>branding/mods.js</code> to add a mod, preview here, then <code>make covers</code> writes <code>mods/&lt;id&gt;/_metadata/0.png</code>. Rules are in <code>branding/README.md</code>.</p>
</main>
<script>
  const mods = Gallery.mods('index.html');
  Gallery.page({ current: 'index.html', sections: [
    { title: 'In the mod browser', items: Gallery.cards(mods.filter(m => !m.deprecated)) },
    { title: 'Deprecated', intro: 'Mods we no longer maintain: own cover plus the red sash (README "Deprecated mods").',
      items: Gallery.cards(mods.filter(m => m.deprecated)) },
  ] });
</script>
</body>
</html>
