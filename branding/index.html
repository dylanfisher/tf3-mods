<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Square Covers</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --page: #161b22; --panel: #1e252e; --card: #262e39; --line: #36404d; --text: #e6ebf0; --muted: #8d99a8; --btn: #3c4f6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.5 Overpass, system-ui, sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 28px 24px 48px; }
  h1 { font-size: 26px; margin: 0 0 4px; font-weight: 800; }
  h2 { font-size: 18px; margin: 32px 0 12px; font-weight: 800; }
  p { color: var(--muted); margin: 0 0 12px; max-width: 80ch; }
  code { font-family: 'Overpass Mono', monospace; font-size: 13px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .seg { display: flex; gap: 4px; }
  .seg button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--btn); border-color: #5a7193; }
  label { display: flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
  .browser { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 16px; background: #1b2129; padding: 16px; border-radius: 10px; }
  .card { background: var(--card); border-radius: 10px; padding: 10px 10px 12px; }
  .cover { border-radius: 6px; overflow: hidden; line-height: 0; cursor: zoom-in; }
  .cover svg { width: 100%; height: auto; }
  .card .title { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; margin: 12px 8px 6px; }
  .card .title::after { content: ""; flex: 1; height: 1px; background: #4a5462; }
  .card .id { color: var(--muted); font-family: 'Overpass Mono', monospace; font-size: 12px; margin: 0 8px; }
  dialog { border: 0; padding: 0; background: transparent; width: 96vw; max-width: 1400px; }
  dialog::backdrop { background: rgba(5, 8, 12, .85); }
  dialog svg { width: 100%; height: auto; border-radius: 8px; }
</style>
<script src="cover.js"></script>
<script src="mods.js"></script>
</head>
<body>
<main>
  <h1>Square: mod covers</h1>
  <p>House style for every mod (direction B2, Diagonal Split). Edit <code>branding/mods.js</code> to add a mod, preview here, then <code>make covers</code> writes <code>mods/&lt;id&gt;/_metadata/0.png</code>. Rules are in <code>branding/README.md</code>.</p>

  <div class="bar">
    <label><input type="checkbox" id="optText" checked> Title text</label>
  </div>

  <h2>In the mod browser</h2>
  <div class="browser" id="browser"></div>
</main>
<dialog id="lb"></dialog>
<script>
  const state = { text: true };
  const opts = () => ({ text: state.text });

  function render() {
    document.getElementById('browser').innerHTML = Square.MODS.map((m, i) => `
      <div class="card">
        <div class="cover" data-i="${i}">${Square.render(m, opts())}</div>
        <div class="title">${m.name}</div>
        <div class="id">${m.id}</div>
      </div>`).join('');
  }
  document.addEventListener('click', e => {
    const c = e.target.closest('.cover');
    if (c) { const lb = document.getElementById('lb'); lb.innerHTML = Square.render(Square.MODS[+c.dataset.i], opts()); lb.showModal(); }
  });
  document.getElementById('lb').addEventListener('click', e => e.currentTarget.close());
  document.getElementById('optText').onchange = e => { state.text = e.target.checked; render(); };
  render();
</script>
</body>
</html>
